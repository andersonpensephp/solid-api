name: Run E2E Tests

on:
  pull_request:
    branches: [master, develop, staging]

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: bitnami/postgresql:latest
        ports:
          - 5433:5432
        env:
          POSTGRESQL_USERNAME: docker
          POSTGRESQL_PASSWORD: docker
          POSTGRESQL_DATABASE: apisolid_test
        options: >-
          --health-cmd="pg_isready -U docker -d apisolid_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test file
        run: |
          echo "NODE_ENV=test" >> .env.test
          echo "JWT_SECRET=${{ secrets.JWT_SECRET_TEST }}" >> .env.test
          echo "DATABASE_URL=postgresql://docker:docker@localhost:5433/apisolid_test?schema=public" >> .env.test

      - name: Setup Prisma
        env:
          DATABASE_URL: postgresql://docker:docker@localhost:5433/apisolid_test?schema=public
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run e2e tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://docker:docker@localhost:5433/apisolid_test?schema=public
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
        run: npm run test:e2e
