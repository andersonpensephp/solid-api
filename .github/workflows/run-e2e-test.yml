name: Run E2E Tests

on:
  pull_request:
    branches:
      - master
      - develop
      - staging

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest

    # Variáveis de ambiente seguras
    env:
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
      DATABASE_URL: postgresql://docker:docker@localhost:5433/apisolid_test?schema=public

    services:
      # Banco de dados PostgreSQL containerizado
      postgres:
        image: bitnami/postgresql:latest
        ports:
          - 5433:5432
        env:
          POSTGRESQL_USERNAME: docker
          POSTGRESQL_PASSWORD: docker
          POSTGRESQL_DATABASE: apisolid_test
        # Healthcheck para garantir que o banco está pronto antes dos testes
        options: >-
          --health-cmd="pg_isready -U docker -d apisolid_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1 Clona o repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 Configura o Node.js com cache do npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3 Instala dependências
      - name: Install dependencies
        run: npm ci

      # 4 Gera o Prisma Client e aplica migrations para o schema de teste
      - name: Setup Prisma
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # 5 Executa os testes E2E
      - name: Run e2e tests
        run: npm run test:e2e